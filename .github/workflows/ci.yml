name: CI

on:
  push:
    branches: [semester-8]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sem-8/src/firmware
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck libgtest-dev libgmock-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: clang-tidy
        run: clang-tidy -p build src/*.cpp
      - name: cppcheck
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr -I include src

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sem-8/src/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install pytest ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
