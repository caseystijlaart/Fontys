name: Docs

on:
  push:
    paths:
      - 'sem-8/docs/**/*.adoc'
      - 'sem-8/docs/**/*.yml'
      - 'sem-8/docs/**/images/**'
  pull_request:
    paths:
      - 'sem-8/docs/**/*.adoc'
      - 'sem-8/docs/**/*.yml'
      - 'sem-8/docs/**/images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz \
            libglib2.0-0 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libpango-1.0-0 libcairo2 libxshmfence1 fonts-liberation libu2f-udev

      - name: Install doc toolchain
        run: |
          gem install --no-document asciidoctor:2.0.26 asciidoctor-pdf:2.3.27 asciidoctor-diagram:3.2.1
          npm install -g @mermaid-js/mermaid-cli@11.17.0
          npx --yes puppeteer browsers install chrome-headless-shell

      - name: Build PDFs from AsciiDoc sources
        run: |
          shopt -s nullglob
          echo '{"args": ["--no-sandbox"]}' > /tmp/puppeteer-config.json
          built_any=false
          for dir in sem-8/docs/*/; do
            name=$(basename "$dir")
            src="${dir}${name}.adoc"
            if [ -f "$src" ]; then
              echo "Building $src"
              asciidoctor-pdf -r asciidoctor-diagram \
                -a mermaid-puppeteer-config=/tmp/puppeteer-config.json \
                "$src" -o "${dir}${name}.pdf"
              built_any=true
            fi
          done
          if [ "$built_any" = false ]; then
            echo "No top-level *.adoc documents found under sem-8/docs/*/ - nothing to build."
          fi

      - name: Commit regenerated PDFs
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: regenerate PDFs from AsciiDoc sources [skip ci]"
          file_pattern: 'sem-8/docs/**/*.pdf'

      - name: Upload PDF artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: sem-8/docs/**/*.pdf
          if-no-files-found: ignore
