name: Docs

on:
  push:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.yml'
      - 'docs/**/images/**'
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.yml'
      - 'docs/**/images/**'
  workflow_dispatch:
    inputs:
      document:
        description: >
          Document to build - must match one of the entries in the DOCS list
          in this workflow's "Build PDFs" step (e.g. "project-plan").
          Leave as "all" to build every listed document.
        type: string
        default: 'all'

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    env:
      TARGET_DOC: ${{ github.event.inputs.document || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed so the "Determine changed documents" step
          # can diff against the pre-push/PR-base commit below.
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz \
            libglib2.0-0 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libpango-1.0-0 libcairo2 libxshmfence1 fonts-liberation libu2f-udev

      - name: Install doc toolchain
        run: |
          gem install --no-document asciidoctor:2.0.26 asciidoctor-pdf:2.3.27 asciidoctor-diagram:3.2.1
          npm install -g @mermaid-js/mermaid-cli@11.17.0
          npx --yes puppeteer browsers install chrome-headless-shell

      - name: Determine changed documents
        id: changed
        if: github.event_name != 'workflow_dispatch'
        run: |
          # Rebuild only the top-level document(s) whose own folder actually
          # changed, instead of rebuilding every document on every push.
          # Must be kept in sync with the DOCS list in "Build PDFs" below.
          DOCS=(
            project-plan
            technical-research
            prototyping-plan
          )

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            # No usable base commit (e.g. first push of a new branch) -
            # fall back to building everything rather than guessing.
            echo "No usable base commit found, building all documents."
            echo "targets=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Changed files:"
          echo "$changed_files"

          targets=()
          for name in "${DOCS[@]}"; do
            if echo "$changed_files" | grep -q "^docs/$name/"; then
              targets+=("$name")
            fi
          done

          echo "Targets: ${targets[*]}"
          echo "targets=${targets[*]}" >> "$GITHUB_OUTPUT"

      - name: Build PDFs from AsciiDoc sources
        run: |
          # Documents built by this pipeline. Add an entry here (matching
          # docs/<name>/<name>.adoc) whenever a new top-level document is
          # ready to be built - e.g. add "system-design-document" once that
          # doc exists.
          DOCS=(
            project-plan
            technical-research
            prototyping-plan
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUESTED="$TARGET_DOC"
          else
            REQUESTED="${{ steps.changed.outputs.targets }}"
          fi

          echo "Requested: $REQUESTED"
          echo '{"args": ["--no-sandbox"]}' > /tmp/puppeteer-config.json
          mkdir -p docs/pdf
          built_any=false
          for name in "${DOCS[@]}"; do
            if [ "$REQUESTED" != "all" ] && [[ ! " $REQUESTED " =~ " $name " ]]; then
              continue
            fi
            src="docs/$name/$name.adoc"
            if [ ! -f "$src" ]; then
              echo "::warning::$src not found, skipping"
              continue
            fi
            echo "Building $src"
            # Run from inside the doc's own folder: asciidoctor-pdf resolves
            # pdf-themesdir relative to the process's working directory, not
            # the document's location, so a bare path-based invocation from
            # the repo root silently falls back to the default theme. The
            # output is redirected to the shared docs/pdf folder so generated
            # PDFs don't clutter the source folders.
            (
              cd "docs/$name"
              asciidoctor-pdf -r asciidoctor-diagram \
                -a mermaid-puppeteer-config=/tmp/puppeteer-config.json \
                "$name.adoc" -o "../pdf/$name.pdf"
            )
            built_any=true
          done

          if [ "$built_any" = false ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Nothing built for '$REQUESTED' - check it's spelled correctly and listed in DOCS."
              exit 1
            else
              echo "No top-level document changed in this push/PR; nothing to build."
            fi
          fi

      - name: Commit regenerated PDFs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: regenerate PDFs from AsciiDoc sources [skip ci]"
          file_pattern: 'docs/pdf/*.pdf'

      - name: Upload PDF artifacts
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: docs/pdf/*.pdf
          if-no-files-found: ignore
