[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Optional TinyML dependencies:
; - EloquentTinyML / TensorFlow Lite Micro wrappers
; - Edge Impulse Arduino SDK (after export)
lib_deps =
    eloquentarduino/EloquentTinyML

build_flags =
    -D POF02_ENABLE_TINYML_TFLM=1
    ; -D POF02_ENABLE_EDGE_IMPULSE=1
