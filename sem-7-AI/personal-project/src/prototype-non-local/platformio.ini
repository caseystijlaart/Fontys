[env:esp32_com3_non_local]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DEVICE_ID=1
    -D DEVICE_NAME=\"ESP32_COM3\"
    -D PLANT_LABEL=\"Aglaonema\"
    -D WIFI_SSID=\"vRijswijk\"
    -D WIFI_PASSWORD='"KvR1964w!%%"'
    -D POF02_ENABLE_TINYML_TFLM=1
    -D MQTT_CLIENT_PREFIX=\"esp32\"
    -D API_KEY=\"sb_publishable_Bh35E-Yrt7uDU_k3nNvTEQ_P608-IkC\"

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

