[env:esp32_com3]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DEVICE_ID=1
    -D DEVICE_NAME=\"ESP32_COM3\"
    -D PLANT_LABEL=\"Aglaonema\"
    -D WIFI_SSID=\"vRijswijk\"
    -D WIFI_PASSWORD='"KvR1964w!%%"'
    -D MQTT_HOST="YOUR_HIVEMQ_TLS_HOST"
    -D MQTT_PORT=8883
    -D MQTT_USERNAME="YOUR_HIVEMQ_USERNAME"
    -D MQTT_PASSWORD="YOUR_HIVEMQ_PASSWORD"
    -D MQTT_TOPIC_PREFIX="fontys/plants"
    -D POF02_ENABLE_TINYML_TFLM=1

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient

