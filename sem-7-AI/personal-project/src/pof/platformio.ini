[env:esp32_com3]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
build_flags =
    -D DEVICE_ID=1
    -D DEVICE_NAME=\"ESP32_COM3\"

lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:esp32_com4]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
build_flags =
    -D DEVICE_ID=2
    -D DEVICE_NAME=\"ESP32_COM4\"

lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor