extends: default
footer:
  height: 1.5cm
  vertical-align: top
  verso:
    left: &footer-content-left
      content: 'Project Plan'
  recto:
    left: *footer-content-left
header:
  height: 1.5cm
  border-color: $footer-border-color
  vertical-align: bottom
  verso: &header-content
    left:
      content: 'Fontys'
  recto: *header-content
title-page:
  align: center
  # image: image::https://www.science.org/do/10.1126/science.aba5361/full/ca_1213NID_Ada_platform_shot2_online-1644914670233.jpg[]
  authors:
    content: "{author}"
    delimiter: "\n"
page:
  size: A4
  margin: [1in, 1in, 1in, 1in]
