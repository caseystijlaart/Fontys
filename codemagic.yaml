workflows:
  ios-workflow:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    working_directory: sem-7-AI/personal-project/src/phm_app
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - casey.stijlaart@hotmail.com
        notify:
          success: true
          failure: true
