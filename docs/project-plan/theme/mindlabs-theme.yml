extends: default

font:
  catalog:
    merge: true

page:
  background_color: FFFFFF
  margin: [2.0cm, 2.0cm, 2.0cm, 2.0cm]

base:
  font_color: 2B2B2B

link:
  font_color: A80016

heading:
  font_color: 1F1F1F
  h1_font_color: D0021B
  h2_font_color: 1F1F1F

title_page:
  background_image: image:title-page-bg.svg[]
  text_align: left
  logo:
    top: 8%
  title:
    top: 60%
    font_size: 30
    font_style: bold
    font_color: 1F1F1F
    line_height: 1.05
  subtitle:
    font_size: 16
    font_style: normal
    font_color: D0021B
    line_height: 1.3
  authors:
    margin_top: 26
    font_size: 12.5
    font_color: 2B2B2B
  revision:
    margin_top: 6
    font_size: 10.5
    font_color: 6B6B6B

toc:
  dot_leader:
    font_color: C9C9C9

table:
  head:
    background_color: FBE0E1

header:
  height: 1.5cm
  font_size: 9
  border_color: EEEEEE
  border_width: 0.5
  padding: [0, 0, 6, 0]
  vertical_align: bottom
  recto:
    left:
      content: '{document-title}'
    right:
      content: '{section-or-chapter-title}'
  verso:
    left:
      content: $header_recto_left_content
    right:
      content: $header_recto_right_content

footer:
  height: 1.2cm
  font_size: 9
  border_color: EEEEEE
  border_width: 0.5
  recto:
    left:
      content: 'Casey Stijlaart'
    right:
      content: '{page-number}'
  verso:
    left:
      content: $footer_recto_left_content
    right:
      content: $footer_recto_right_content
