[project]
name = "holobox-sensing-pipeline"
version = "0.1.0"
description = "Real-time sensor fusion and height-classification pipeline for the Holobox sensing system."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
